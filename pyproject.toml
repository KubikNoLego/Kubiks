[project]
name = "kubiks"
version = "0.1.2"
description = "A simple library that allows you to work with .kbk files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

authors = [
    {name = "KubikNoLego", email = "originallikitun@gmail.com"}
]
license = {text = "MIT"}
keywords = ["configuration", "parser", "interpreter", "kbk"]

[project.urls]
Homepage = "https://github.com/KubikNoLego/Kubiks"
Repository = "https://github.com/KubikNoLego/Kubiks"
Issues = "https://github.com/KubikNoLego/Kubiks/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kubiks"]
